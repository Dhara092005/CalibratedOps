[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrated-ops"
version = "1.13.0"
description = "A local human-in-the-loop calibrated agent research harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
calibrated-ops = "calibrated_ops.__main__:main"

[tool.setuptools.packages.find]
include = ["calibrated_ops*"]

[tool.setuptools.package-data]
calibrated_ops = ["static/*", "data/*.csv", "data/*.json"]
