services:
  - type: web
    name: calibratedops
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: CALIBRATED_DATABASE
        value: /var/data/calibrated_ops.sqlite3
      - key: CALIBRATED_PASSWORD
        generateValue: true
    disk:
      name: calibratedops-data
      mountPath: /var/data
      sizeGB: 1
